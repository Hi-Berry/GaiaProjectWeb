<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaia Project — 서버 현황</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#0b0e17;color:#e5e7eb;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
  h1{font-size:1.4rem;letter-spacing:.06em;margin:.2rem 0 .3rem}
  .sub{color:#94a3b8;font-size:.85rem;margin-bottom:1.6rem;text-align:center}
  .grid{display:flex;flex-direction:column;gap:.9rem;width:100%;max-width:560px}
  .card{background:#141a2a;border:1px solid #ffffff14;border-radius:14px;padding:1rem 1.2rem;display:flex;align-items:center;gap:1rem}
  .dot{width:14px;height:14px;border-radius:50%;flex:none}
  .up{background:#22c55e;box-shadow:0 0 10px #22c55e88}
  .down{background:#ef4444}
  .wait{background:#eab308;animation:p 1.2s infinite}
  @keyframes p{50%{opacity:.35}}
  .info{flex:1;min-width:0}
  .name{font-weight:700}
  .meta{font-size:.8rem;color:#94a3b8;margin-top:.15rem}
  a.go{flex:none;background:#4f46e5;color:#fff;text-decoration:none;padding:.5rem .9rem;border-radius:9px;font-size:.85rem;font-weight:600}
  a.go.dis{background:#334155;pointer-events:none;opacity:.6}
  .best{border-color:#4f46e5aa}
  .pinned{border-color:#f59e0baa;box-shadow:0 0 0 1px #f59e0b33}
  .notice{font-size:.8rem;color:#fcd34d;margin-top:.25rem;word-break:break-word}
  .warn{color:#fca5a5}
  .banner{max-width:560px;width:100%;background:#4f46e51a;border:1px solid #4f46e555;border-radius:12px;padding:.8rem 1rem;font-size:.9rem;margin-bottom:1rem;display:none}
  .links{width:100%;max-width:560px;margin-top:1.4rem;display:flex;flex-direction:column;gap:.6rem}
  a.link{display:flex;align-items:center;gap:.7rem;background:#141a2a;border:1px solid #ffffff14;border-radius:12px;padding:.8rem 1rem;color:#e5e7eb;text-decoration:none}
  a.link:hover{border-color:#4f46e5aa}
  a.link .name{font-weight:700;font-size:.9rem}
  a.link .meta{font-size:.78rem;color:#94a3b8;margin-top:.15rem}
  .foot{color:#64748b;font-size:.75rem;margin-top:1.6rem}
</style>
</head>
<body>
<h1>🪐 Gaia Project 서버 현황</h1>
<div class="sub">무료 서버 용량이 소진되면 해당 서버는 접속이 안 됩니다.<br>🟢 초록 서버에서 플레이하세요 — 사람 대전 상대는 사람 많은 곳으로!<br><span class="warn">🤖 AI 봇 가능 서버는 AI 연산으로 느려서 사람 간의 대전은 추천하지 않습니다.</span></div>
<div class="banner" id="banner"></div>
<div class="grid" id="grid"></div>
<div class="links">
  <a class="link" href="https://hikary.pythonanywhere.com" target="_blank" rel="noopener">
    <span style="font-size:1.3rem">📊</span>
    <span class="info"><span class="name">기록 사이트 바로 가기</span><span class="meta" style="display:block">전적·기록 확인</span></span>
  </a>
</div>
<div class="foot">30초마다 자동 갱신 · 응답 없음 = 이번 달 무료 용량 소진</div>
<script>
// ★ 여기에 운영 중인 인스턴스를 추가/수정하세요 (이름, 주소)
const INSTANCES = [
  // ★ 최상위 메인 서버 (Linode 자체 호스팅). 아래 onrender 인스턴스들보다 위에 표시된다.
  //   앞단 Caddy가 :443에서 TLS를 받아 localhost:5000으로 프록시한다. 도메인 없이 https를 쓰려고
  //   sslip.io(IP를 그대로 호스트명으로 바꿔주는 공개 DNS)를 쓴다 — Let's Encrypt가 IP에는
  //   인증서를 안 내주기 때문. 나중에 도메인을 붙이면 Caddyfile 첫 줄과 이 URL만 바꾸면 된다.
  //   ※ http(:5000)로 두면 https인 이 페이지에서 혼합 콘텐츠로 차단돼 항상 '응답 없음'이 된다.
  { name: '메인 서버', url: 'https://172-104-86-178.sslip.io' },
  { name: '서버 1', url: 'https://gaiaprojectweb.onrender.com' },
  { name: '서버 2', url: 'https://gaiaprojectweb-1.onrender.com' },
  { name: '서버 3', url: 'https://gaiaprojectweb-49wr.onrender.com' },
  { name: '서버 4', url: 'https://gaiaprojectweb-8plp.onrender.com' },
  { name: '서버 5', url: 'https://gaiaprojectweb-tvog.onrender.com' },
];

async function check(inst){
  const ctl = new AbortController();
  const to = setTimeout(()=>ctl.abort(), 8000);
  try{
    const r = await fetch(inst.url + '/api/status', { signal: ctl.signal, cache: 'no-store' });
    clearTimeout(to);
    if(!r.ok) return { ...inst, state:'down' };
    const j = await r.json();
    // notice/recommend/noticeAt = 서버가 /api/status/notice로 실시간 지정한 안내 (구버전 서버면 undefined → 무시)
    return { ...inst, state:'up', games:j.activeGames||0, humans:j.humanPlayers||0, ai:j.aiEnabled!==false,
             notice:j.notice||null, recommend:j.recommend===true, noticeAt:j.noticeAt||0 };
  }catch(e){ clearTimeout(to); return { ...inst, state:'down' }; }
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(list){
  // [사용자 2026-08-03] AI 봇 가능 서버는 추천에서 제외 — 거기선 사람끼리 게임을 안 하므로
  // 추천(배너·best 하이라이트)은 '사람 전용(AI 봇 없음)' 서버 중에서만 고른다. 사람 많은 순 → 진행 게임 순.
  const ups = list.filter(x=>x.state==='up');
  // [사용자 2026-08-04] 운영자가 서버의 /api/status/notice로 직접 지정한 서버가 있으면 자동 추천을 덮는다.
  //   여러 서버에 지정이 남아 있으면 가장 최근에 지정된 것(noticeAt 최대)을 쓴다 → 새로 지정할 때 나머지를
  //   일일이 해제할 필요 없이 URL 하나로 전환된다. 지정이 없으면 기존 자동 추천 로직 그대로.
  const pinned = ups.filter(x=>x.recommend).sort((a,b)=>b.noticeAt-a.noticeAt)[0];
  const humanOnly = ups.filter(x=>!x.ai);
  const auto = humanOnly.sort((a,b)=>(b.humans-a.humans)||(b.games-a.games))[0];
  const best = pinned || auto;
  const grid = document.getElementById('grid');
  grid.innerHTML = list.map(x=>{
    const cls = x.state==='up'?'up':x.state==='wait'?'wait':'down';
    const isPinned = pinned && x.url===pinned.url;
    const meta = x.state==='up'
      ? `진행 중 게임 ${x.games} · 접속 인원 ${x.humans}명 · ${x.ai?'🤖 AI 봇 가능 — AI 연산으로 느려 사람 대전 비추천':'🙅 AI 봇 없음(사람 전용)'}`
        + (isPinned?' · 👉 여기서 플레이하세요':(best&&x.url===best.url&&x.humans>0&&!x.ai?' · 🔥 사람 대전은 여기!':''))
      : x.state==='wait' ? '확인 중…' : '응답 없음 — 이번 달 용량 소진(접속 불가)';
    // 안내 문구는 지정 여부와 무관하게 표시 — '점검 중' 같은 알림도 서버별로 띄울 수 있게
    const noticeLine = (x.state==='up' && x.notice) ? `<div class="notice">📢 ${esc(x.notice)}</div>` : '';
    return `<div class="card ${isPinned?'pinned':(best&&x.url===best.url?'best':'')}">
      <div class="dot ${cls}"></div>
      <div class="info"><div class="name">${esc(x.name)}</div><div class="meta">${meta}</div>${noticeLine}</div>
      <a class="go" href="${x.url}" target="_blank" rel="noopener">${x.state==='up'?'플레이':'접속 시도'}</a>
    </div>`;
  }).join('');
  const b = document.getElementById('banner');
  b.style.display='block';
  if(pinned){
    b.innerHTML = `👉 <b>${esc(pinned.name)}</b> 에서 플레이하세요`
      + (pinned.notice?` — ${esc(pinned.notice)}`:'')
      + (pinned.humans>0?` (지금 ${pinned.humans}명 접속 중)`:'');
  } else if(auto){
    b.innerHTML = `👉 사람 대전 추천: <b>${esc(auto.name)}</b> (사람 전용 서버)` + (auto.humans>0?` — 지금 ${auto.humans}명 접속 중!`:'');
  } else if(ups.length){
    // 사람 전용 서버가 하나도 안 열려 있음 — AI 봇 서버는 추천하지 않고 안내만
    b.innerHTML = '⚠️ 지금 사람 전용 서버가 없습니다. 아래 서버는 AI 봇 대전용이며, AI 연산으로 느려서 사람 간의 대전은 추천하지 않습니다.';
  } else {
    b.innerHTML = '⚠️ 지금 모든 서버가 응답하지 않습니다. 잠시 후 새로고침 해보세요.';
  }
}

async function tick(){
  render(INSTANCES.map(i=>({ ...i, state:'wait' })));
  const results = await Promise.all(INSTANCES.map(check));
  render(results);
}
tick();
setInterval(tick, 30000);
</script>
</body>
</html>
