# 통계 사이트 자동 빌드·배포 — 게임 저장 훅(repository_dispatch) / 수동 / 매일 06:00 KST 보정.
# 흐름: Supabase에서 새 게임 로그 증분 다운로드 → stats-site 빌드 → Netlify에 dist 배포.
# 필요한 저장소 Secrets: SUPABASE_SERVICE_ROLE_KEY, NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
name: stats-site

on:
  repository_dispatch:
    types: [game-finished]
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # UTC 21:00 = KST 06:00 (활동 0인 새벽 시간대)

# 게임이 연달아 끝나도 빌드는 하나로 합쳐지게 (진행 중이면 취소하고 최신 것만)
concurrency:
  group: stats-site-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Supabase에서 게임 로그 증분 다운로드
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetchSupabaseGames.mjs

      - name: 통계 사이트 빌드
        run: node stats-site/build.mjs

      - name: Netlify 배포
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --prod --dir=stats-site/dist --message "auto (${{ github.event_name }})"
